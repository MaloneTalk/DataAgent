server.port=8080

spring.application.name=data-agent-management

management.endpoints.web.exposure.include=health

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/data_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# MyBatis-Plus Configuration
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=io.github.malonetalk.model.po
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# Model Configuration
io.github.malonetalk.model.provider=openai
io.github.malonetalk.model.name=deepseek-v4-flash
io.github.malonetalk.model.base-url=https://api.deepseek.com
io.github.malonetalk.model.api-key=${IO_GITHUB_MALONETALK_MODEL_API_KEY:}
io.github.malonetalk.model.thinking-enabled=${IO_GITHUB_MALONETALK_MODEL_THINKING_ENABLED:true}

spring.config.import=classpath:skill.properties

# Auth Configuration (login round): all env-driven, no secrets committed.
# JWT secret must be >= 32 bytes in production; blank => in-memory random key (dev only, tokens invalidated on restart).
jwt.secret=${JWT_SECRET:}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
# Initial admin password for first startup when sys_user is empty; fail-closed if unset.
admin.init-password=${ADMIN_INIT_PASSWORD:}

# Observability: Micrometer Tracing + OpenTelemetry (W3C traceparent)
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c
# 默认不导出 span；接入 OTLP Collector 后把开关置 true（或设置 TRACING_OTLP_EXPORT_ENABLED=true）
management.tracing.export.otlp.enabled=${TRACING_OTLP_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# 指标导出默认关闭；接入 OTLP Collector 后设置 METRICS_OTLP_EXPORT_ENABLED=true
management.otlp.metrics.export.enabled=${METRICS_OTLP_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
# 日志导出默认关闭（仅终端）；在 Docker 中设置 LOGS_OTLP_EXPORT_ENABLED=true
management.logging.export.otlp.enabled=${LOGS_OTLP_EXPORT_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
