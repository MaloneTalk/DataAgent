server.port=8080

spring.application.name=data-agent-management

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/data_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=io.github.malonetalk.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Model Configuration
io.github.malonetalk.model.provider=dashscope
io.github.malonetalk.model.name=qwen3-max
io.github.malonetalk.model.base-url=
io.github.malonetalk.model.api-key=${IO_GITHUB_MALONETALK_MODEL_API_KEY:${DASHSCOPE_API_KEY:}}
io.github.malonetalk.model.thinking-enabled=${IO_GITHUB_MALONETALK_MODEL_THINKING_ENABLED:false}

spring.config.import=classpath:skill.properties

# Scheduled agent task configuration
data-agent.schedule.lock-duration=${DATA_AGENT_SCHEDULE_LOCK_DURATION:PT30M}

# Auth Configuration (login round): all env-driven, no secrets committed.
# JWT secret must be >= 32 bytes in production; blank => in-memory random key (dev only, tokens invalidated on restart).
jwt.secret=${JWT_SECRET:}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
# Initial admin password for first startup when sys_user is empty; fail-closed if unset.
admin.init-password=${ADMIN_INIT_PASSWORD:}
