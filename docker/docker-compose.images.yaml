# Data Agent Docker Compose（直接拉取镜像，无需本地构建）
#
# 与 docker-compose.yml 的区别：本文件不执行 `build`，直接拉取 GHCR 上已发布的镜像，
# 因此不需要仓库源码即可启动。
#
# 使用方式：
#   cp docker/.env.example docker/.env   # 编辑 .env，填入模型 API Key 等
#   docker compose -f docker/docker-compose.images.yaml up -d
#
# 镜像地址可通过环境变量覆盖，例如：
#   IMAGE_REGISTRY=ghcr.io IMAGE_NAMESPACE=my-org docker compose -f docker/docker-compose.images.yaml up -d

services:
  # MySQL Database
  #
  # 镜像在官方 mysql:8.0 之上叠加了 sql/data_source.sql（见 docker/db-init/Dockerfile），
  # 全新数据卷首次启动时自动建表，无需仓库内的 SQL 文件。
  mysql:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-decade-zio}/data-agent-db-init:${IMAGE_TAG:-latest}
    container_name: data-agent-mysql
    restart: unless-stopped
    environment:
      # 可通过 .env.example 覆盖：DB_PASSWORD=xxx
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: data_agent
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      # 可通过 .env.example 覆盖：MYSQL_PORT=3307
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - data-agent-mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --character-set-client-handshake=FALSE
      - --init-connect='SET NAMES utf8mb4'
      - --default-authentication-plugin=mysql_native_password
    networks:
      - data-agent-network
    healthcheck:
      # 使用 mysql 命令实际测试数据库连接和查询
      test: ["CMD", "mysql", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}", "-e", "SELECT 1 FROM data_agent.sys_user LIMIT 1;"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Backend Service (Spring Boot)
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-decade-zio}/data-agent-backend:${IMAGE_TAG:-latest}
    container_name: data-agent-backend
    restart: unless-stopped
    environment:
      # 数据库配置（通常不需要修改）
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/data_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}

      # AI 模型配置（重要：需要配置真实的 API Key）
      # 可通过 .env.example 覆盖：IO_GITHUB_MALONETALK_MODEL_API_KEY=sk-xxx
      IO_GITHUB_MALONETALK_MODEL_PROVIDER: ${IO_GITHUB_MALONETALK_MODEL_PROVIDER:-dashscope}
      IO_GITHUB_MALONETALK_MODEL_NAME: ${IO_GITHUB_MALONETALK_MODEL_NAME:-qwen3-max}
      IO_GITHUB_MALONETALK_MODEL_BASE_URL: ${IO_GITHUB_MALONETALK_MODEL_BASE_URL:-}
      IO_GITHUB_MALONETALK_MODEL_API_KEY: ${IO_GITHUB_MALONETALK_MODEL_API_KEY:-}
      IO_GITHUB_MALONETALK_MODEL_THINKING_ENABLED: ${IO_GITHUB_MALONETALK_MODEL_THINKING_ENABLED:-false}

      # JWT 配置（可通过 .env.example 覆盖）
      # JWT_SECRET 必须 >= 32 字节
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}

      # 初始管理员密码（首次启动时使用）
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-admin}

      CSV_DATASOURCE_ID: ${CSV_DATASOURCE_ID:-0}
      CSV_IMPORT_DIRECTORY: /app/csv-imports
      CSV_WRITER_URL: ${CSV_WRITER_URL:-}
      CSV_WRITER_USERNAME: ${CSV_WRITER_USERNAME:-}
      CSV_WRITER_PASSWORD: ${CSV_WRITER_PASSWORD:-}

      # OpenTelemetry（可选）：配合 docker/observability 的 Grafana LGTM 栈查看 trace/metrics/logs
      TRACING_OTLP_EXPORT_ENABLED: ${TRACING_OTLP_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-lgtm:4318/v1/traces}
      METRICS_OTLP_EXPORT_ENABLED: ${METRICS_OTLP_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-lgtm:4318/v1/metrics}
      LOGS_OTLP_EXPORT_ENABLED: ${LOGS_OTLP_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://otel-lgtm:4318/v1/logs}

      TZ: Asia/Shanghai
    volumes:
      - data-agent-csv-imports:/app/csv-imports
    ports:
      # 可通过 .env.example 覆盖：BACKEND_PORT=8081
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data-agent-network

  # Frontend Service (Vue + Nginx)
  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-decade-zio}/data-agent-frontend:${IMAGE_TAG:-latest}
    container_name: data-agent-frontend
    restart: unless-stopped
    ports:
      # 可通过 .env.example 覆盖：FRONTEND_PORT=3001
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - data-agent-network

volumes:
  data-agent-csv-imports:
  data-agent-mysql:
    name: data-agent-mysql

networks:
  data-agent-network:
    name: data-agent-network
